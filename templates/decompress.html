<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Decompress File</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <div class="card">
        <h1>📂 Decompress File</h1>
        <p class="subtitle">
            Decompress a Huffman-compressed file locally
        </p>

        <form method="POST" enctype="multipart/form-data">
            <label class="file-upload">
                <input type="file" name="file" id="fileInput" required>
                <span id="fileText">📁 Choose a .huff file</span>
            </label>

            <button type="submit" class="btn">
                Decompress & Download
            </button>
        </form>

        <p class="note">
            Upload a <b>.huff</b> file to restore the original file.
        </p>
    </div>

    <footer>
        <p>Built using C + Flask | Huffman Coding Project</p>
    </footer>
</div>

<script>
const fileInput = document.getElementById("fileInput");
const fileText = document.getElementById("fileText");

fileInput.addEventListener("change", () => {
    if (fileInput.files.length > 0) {
        fileText.textContent = "📄 " + fileInput.files[0].name;
    } else {
        fileText.textContent = "📁 Choose a .huff file";
    }
});
</script>

</body>
</html>
