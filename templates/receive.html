<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Huffman Receiver</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <div class="card">
        <h1>📥 Huffman File Receiver</h1>
        <p class="subtitle">
            Enter the key to download and decompress the file
        </p>

         <!-- RECEIVER FORM -->
        <form method="POST">
            <div class="input-box">
                <input
                    type="text"
                    name="key"
                    class="text-input"
                    placeholder="🔑 Enter download key"
                    required
                >
            </div>

            <button type="submit" class="btn">
                Download & Decompress
            </button>
        </form>

        <!-- ERROR MESSAGE -->
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <p class="note">
            The file will be decompressed on the server and downloaded in its original format.
        </p>
    </div>

    <footer>
        <p>Built using C + Flask | Huffman Coding Project</p>
    </footer>
</div>

<!-- ✅ JS: show typed key -->
<script>
const keyInput = document.getElementById("keyInput");
const keyText = document.getElementById("keyText");

keyInput.addEventListener("input", () => {
    if (keyInput.value.trim() !== "") {
        keyText.textContent = "🔑 " + keyInput.value;
    } else {
        keyText.textContent = "🔑 Enter download key";
    }
});
</script>

</body>
</html>
